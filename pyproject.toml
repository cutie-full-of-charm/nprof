[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "nprof"
version = "0.6.11"
requires-python = ">=3.9"
description = "Lightweight statistical resource profiler for Python with CPU, RAM and GPU monitoring and interactive HTML reports."
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
dependencies = [
    "psutil",
    "nvidia-ml-py",
]

keywords = [
    "profiling",
    "profiler",
    "resource-monitoring",
    "performance",
    "benchmarking",
    "cpu",
    "memory",
    "ram",
    "gpu",
    "nvidia",
    "intel",
    "sampling-profiler",
    "html-report",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Benchmark",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
nprof = "nprof:main"

[project.urls]
Homepage = "https://github.com/cutie-full-of-charm/nprof"
Repository = "https://github.com/cutie-full-of-charm/nprof"
Issues = "https://github.com/cutie-full-of-charm/nprof/issues"

[tool.setuptools.packages.find]
where = ["src"]
